[project]
name = "bayes-tidit"
version = "0.1.0"
description = "Notebook and scripts for the TIDIT Bayes retreat talk"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "numpy>=2.5.3",
    "numpyro>=0.22.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.optional-dependencies]
crosscheck = [
    "cmdstanpy>=1.3.0",
    "pymc>=6.3.2",
]

[dependency-groups]
dev = [
    "jupytext>=1.19.5",
]
